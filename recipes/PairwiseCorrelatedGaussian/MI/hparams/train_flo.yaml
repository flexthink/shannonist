seed: 1337

# Synthetic data. The matrix must be symmetric, have a zero diagonal, and
# produce a positive-semidefinite Gaussian correlation matrix.
mutual_information:
    - [0.0, 0.20, 0.10]
    - [0.20, 0.0, 0.15]
    - [0.10, 0.15, 0.0]
count: 3
dim: 20
train_samples: 32768
valid_samples: 8192

# Training
number_of_epochs: 20
batch_size: 256
lr: 0.0001

# Model
feature_dim: 64
encoder_hidden_dims: [128, 128]

train_set: !new:shannonist.mi.PairwiseCorrelatedGaussian
    mutual_information: !ref <mutual_information>
    dim: !ref <dim>
    num_samples: !ref <train_samples>

valid_set: !new:shannonist.mi.PairwiseCorrelatedGaussian
    mutual_information: !ref <mutual_information>
    dim: !ref <dim>
    num_samples: !ref <valid_samples>

encoder: !new:shannonist.models.MultiMLP
    input_dim: !ref <dim>
    count: !ref <count>
    output_dim: !ref <feature_dim>
    hidden_dim: !ref <encoder_hidden_dims>

estimator: !new:shannonist.mi.PairwiseFLO
    encoder: !ref <encoder>
    count: !ref <count>
    tau: 1.0
    use_norm: True

optimizer: !name:torch.optim.Adam
    lr: !ref <lr>

train_loader_kwargs:
    batch_size: !ref <batch_size>
    shuffle: True
    num_workers: 0
    collate_fn: !name:shannonist.mi.tensordict_collate

valid_loader_kwargs:
    batch_size: !ref <batch_size>
    shuffle: False
    num_workers: 0
    collate_fn: !name:shannonist.mi.tensordict_collate
