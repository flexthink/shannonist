[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shannonist"
version = "0.1.0"
description = "Information-theoretical analysis of machine learning models with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hyperpyyaml",
    "tensordict",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
